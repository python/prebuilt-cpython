name: Relocatability

# Build CPython main and run `relocatable.py test` against it.

on:
  push:
  pull_request:
  schedule:
    # Daily, to track changes in CPython main.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Forks get the schedule too; only run it in the original repository.
    if: github.event_name != 'schedule' || github.event.repository.fork == false
    uses: ./.github/workflows/reusable-build.yml
